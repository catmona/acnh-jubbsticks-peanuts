# Once a day: build the port's latest release with this repo's released patch, and keep one issue here saying which fixes no
# longer fit. It only reads the port's repo; it never posts there. The audit (tools/audit_port.py) needs vanilla game files, so it
# stays a local step.
name: Port release check
on:
  schedule:
    - cron: '23 14 * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
env:
  PORT: dragonloverlord/Unnofficial-Jubbsticks-Additions-Port
  TITLE: Port release check
  GH_TOKEN: ${{ github.token }}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download the port's latest release and the released patch
        run: |
          mkdir -p "$RUNNER_TEMP/rc"; cd "$RUNNER_TEMP/rc"
          gh api "repos/$PORT/releases/latest" --jq .tag_name > tag
          gh release download "$(cat tag)" --repo "$PORT" --pattern '*Atmosphere*.7z' --output port.7z
          gh release download --repo "$GITHUB_REPOSITORY" --pattern 'jub-port-patch.json' --dir .
      - name: Build it
        run: |
          cd "$RUNNER_TEMP/rc"
          if node "$GITHUB_WORKSPACE/test/run.mjs" port.7z jub-port-patch.json out.zip --report report.json 2> err.txt; then rm -f err.txt; fi
      - id: body
        name: Write the report
        run: |
          cd "$RUNNER_TEMP/rc"
          node "$GITHUB_WORKSPACE/test/release-check.mjs" jub-port-patch.json report.json "$(cat tag)" err.txt > body.md
          cat body.md
      - name: Open, update or close the issue
        run: |
          cd "$RUNNER_TEMP/rc"
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$TITLE\" in:title" --json number,title \
              --jq "map(select(.title | startswith(\"$TITLE\")))[0].number // empty")
          if [ "${{ steps.body.outputs.clean }}" = "true" ]; then
            if [ -n "$n" ]; then gh issue close "$n" --repo "$GITHUB_REPOSITORY" --comment "$(cat body.md)"; fi
          elif [ -n "$n" ]; then
            gh issue edit "$n" --repo "$GITHUB_REPOSITORY" --title "$TITLE: $(cat tag)" --body-file body.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE: $(cat tag)" --body-file body.md
          fi
